project:
  name: CardioShift
  root_seed: 20260729

features:
  numeric:
    - age
    - trestbps
    - chol
    - thalach
    - oldpeak
    - ca
  categorical:
    - sex
    - cp
    - fbs
    - restecg
    - exang
    - slope
    - thal
  forbidden_predictors:
    - site
    - patient_id
    - num
    - target

validation:
  primary: leave_one_hospital_out
  random_split:
    repeats: 10
    test_size: 0.20
  bootstrap:
    replicates: 2000
    confidence_level: 0.95

models:
  logistic_regression:
    C: [0.1, 1.0, 10.0]
    class_weight: [null, balanced]
    max_iter: 2000
  random_forest:
    n_estimators: [400]
    max_depth: [null, 6]
    min_samples_leaf: [2, 8]
    class_weight: [balanced]
  hist_gradient_boosting:
    learning_rate: [0.03, 0.08]
    max_leaf_nodes: [7, 15]
    l2_regularization: [0.0, 1.0]

calibration:
  method: sigmoid

safety:
  ood_quantile: 0.975
  conformal_alpha: 0.10
  probability_ambiguity_band: [0.40, 0.60]
  missing_fraction_quantile: 0.975

stress_tests:
  mcar_repeats: 5
  bootstrap_replicates: 500
  mcar_fractions: [0.10, 0.30, 0.50]
  grouped:
    no_exercise:
      - thalach
      - exang
      - oldpeak
      - slope
    no_ecg:
      - restecg
      - thalach
      - exang
      - oldpeak
      - slope
    basic_vitals_only:
      - age
      - sex
      - trestbps
      - chol
